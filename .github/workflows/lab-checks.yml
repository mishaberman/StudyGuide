name: API lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  openai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openai-api-labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python labs/17_micro_tests.py
  claude:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-platform-labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
